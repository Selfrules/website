name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
    # Skip for Claude Code branches (internal work)
    branches-ignore:
      - 'claude/**'
    # Only run on code changes (skip docs, config, etc.)
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.css'
      - 'app/**'
      - 'components/**'
      - 'lib/**'

jobs:
  claude-review:
    # Run only when:
    # 1. PR has 'needs-review' label, OR
    # 2. Author is external contributor (FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, CONTRIBUTOR)
    if: |
      contains(github.event.pull_request.labels.*.name, 'needs-review') ||
      github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'FIRST_TIMER' ||
      github.event.pull_request.author_association == 'CONTRIBUTOR'

    runs-on: ubuntu-latest
    timeout-minutes: 5  # Fail fast if review takes too long

    # Cancel previous reviews if new push arrives
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Quick code review - focus ONLY on:
            1. Critical bugs and runtime errors
            2. Security vulnerabilities (XSS, SQL injection, etc.)
            3. Breaking changes to existing functionality

            Skip style/formatting (linters handle this).
            Be concise - max 5 bullet points.

            Use `gh pr comment` to post your review.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # Use haiku model for faster reviews (less comprehensive but much faster)
          claude_args: '--model haiku --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

