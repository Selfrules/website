name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  # Shared setup job to avoid redundant npm ci across jobs
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    needs: setup
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_ENV: preview

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Preview deployed to: $DEPLOYMENT_URL"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Preview deployment')
            })

            const output = `## 🔍 Preview deployment ready!

            ### ✅ Environment Details
            - **URL**: ${{ steps.deploy.outputs.url }}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Branch**: ${context.ref}

            ### 📊 Build Info
            - Status: Success
            - Duration: ${{ job.duration }}s

            ---
            *Preview environments are automatically cleaned up 7 days after PR merge*`

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Run Lighthouse CI
        # Only run Lighthouse when:
        # 1. PR targets main branch (production-critical), OR
        # 2. PR has 'performance-test' label
        if: |
          github.base_ref == 'main' ||
          contains(github.event.pull_request.labels.*.name, 'performance-test')
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ steps.deploy.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: [setup, deploy-preview]
    # Run only when:
    # 1. PR has 'visual-test' label, OR
    # 2. PR is targeting main branch (production-critical), OR
    # 3. PR modifies UI components
    if: |
      contains(github.event.pull_request.labels.*.name, 'visual-test') ||
      github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual tests
        run: npx playwright test --project=chromium
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  cleanup-preview:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Cleanup old preview deployments
        run: |
          echo "Cleaning up preview environment for PR #${{ github.event.pull_request.number }}"
          # Vercel automatically removes preview deployments after 7 days
          # Additional cleanup logic can be added here

      - name: Comment cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧹 Preview environment scheduled for cleanup within 7 days'
            })
