name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (High & Critical only)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Run full security audit (report)
        run: npm audit
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let auditOutput = '';
            try {
              auditOutput = execSync('npm audit --json', { encoding: 'utf-8' });
            } catch (error) {
              auditOutput = error.stdout;
            }

            const audit = JSON.parse(auditOutput);
            const { vulnerabilities, metadata } = audit;

            const high = metadata.vulnerabilities.high || 0;
            const critical = metadata.vulnerabilities.critical || 0;
            const moderate = metadata.vulnerabilities.moderate || 0;
            const low = metadata.vulnerabilities.low || 0;

            const body = `## 🔒 Security Audit Results

            **Vulnerabilities Found:**
            - 🔴 Critical: ${critical}
            - 🟠 High: ${high}
            - 🟡 Moderate: ${moderate}
            - 🟢 Low: ${low}

            ${critical + high > 0 ? '⚠️ **Action Required:** Fix high/critical vulnerabilities before merging!' : '✅ **All Clear:** No high or critical vulnerabilities found.'}

            <details>
            <summary>Full Audit Report</summary>

            \`\`\`
            ${execSync('npm audit', { encoding: 'utf-8' })}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
